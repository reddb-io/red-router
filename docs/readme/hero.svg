<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="rr-hero-title rr-hero-desc">
  <title id="rr-hero-title">RedRouter — the control plane for AI model traffic</title>
  <desc id="rr-hero-desc">Coding agents and applications send every request to one RedRouter endpoint. RedRouter applies per-key policy and limits, routes to the configured providers, and fails over to the next model when one is unavailable.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2056" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff2056" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2056"/>
      <stop offset="1" stop-color="#ff2056" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="420" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse cx="120" cy="60" rx="420" ry="300" fill="url(#glow)"/>
    <ellipse cx="1120" cy="410" rx="360" ry="240" fill="url(#glow)" opacity="0.5"/>

    <!-- left: name, promise, pillars -->
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="72" y="140" font-size="78" font-weight="700" fill="#f0f6fc" letter-spacing="-3">RedRouter</text>
      <rect x="496" y="92" width="16" height="48" fill="#ff2056"/>

      <text x="72" y="190" font-size="28" font-weight="600" fill="#ff2056" letter-spacing="-0.5">Control plane for AI traffic</text>
      <rect x="74" y="214" width="132" height="3" fill="url(#rule)"/>

      <text x="72" y="254" font-size="18" fill="#8b949e">One endpoint for every agent and app.</text>
      <text x="72" y="280" font-size="18" fill="#8b949e">Policy, spend and failover in one place.</text>

      <text x="72" y="318" font-size="11" fill="#6e7681" letter-spacing="2.5">BUILT AROUND</text>
      <g font-size="14" fill="#c9d1d9">
        <rect x="72" y="330" width="130" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ff2056" stroke-opacity="0.35"/>
        <text x="88" y="349">Continuity</text>
        <rect x="214" y="330" width="104" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="230" y="349">Control</text>
        <rect x="330" y="330" width="120" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="346" y="349">Visibility</text>
        <rect x="72" y="366" width="164" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="88" y="385">Self-hosted</text>
        <rect x="248" y="366" width="216" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="264" y="385">OpenAI · Anthropic API</text>
      </g>
    </g>

    <!-- right: clients -> RedRouter -> providers -->
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14">
      <!-- clients -->
      <text x="600" y="78" font-size="11" fill="#6e7681" letter-spacing="2">CLIENTS</text>
      <g fill="#c9d1d9">
        <rect x="600" y="92" width="150" height="36" rx="8" fill="#0b0f15" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="616" y="115">coding agents</text>
        <rect x="600" y="140" width="150" height="36" rx="8" fill="#0b0f15" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="616" y="163">IDE plugins</text>
        <rect x="600" y="188" width="150" height="36" rx="8" fill="#0b0f15" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="616" y="211">applications</text>
        <rect x="600" y="236" width="150" height="36" rx="8" fill="#0b0f15" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="616" y="259">MCP agents</text>
      </g>
      <g stroke="#ff2056" stroke-opacity="0.45" stroke-width="1.5" fill="none">
        <path d="M750 110 C790 110 790 182 818 182"/>
        <path d="M750 158 C785 158 790 182 818 182"/>
        <path d="M750 206 C785 206 790 182 818 182"/>
        <path d="M750 254 C790 254 790 182 818 182"/>
      </g>

      <!-- router -->
      <rect x="820" y="92" width="176" height="180" rx="12" fill="#0b0f15" stroke="#ff2056" stroke-opacity="0.55"/>
      <text x="838" y="120" font-size="12" fill="#ff2056" letter-spacing="1">REDROUTER /v1</text>
      <g fill="#c9d1d9" font-size="13">
        <text x="838" y="150">▸ key policy</text>
        <text x="838" y="174">▸ spend limits</text>
        <text x="838" y="198">▸ combos</text>
        <text x="838" y="222">▸ failover</text>
        <text x="838" y="246">▸ usage ledger</text>
      </g>

      <!-- providers -->
      <text x="1040" y="78" font-size="11" fill="#6e7681" letter-spacing="2">PROVIDERS</text>
      <g stroke-width="1.5" fill="none">
        <path d="M996 182 C1020 182 1020 110 1040 110" stroke="#f85149" stroke-opacity="0.55" stroke-dasharray="4 4"/>
        <path d="M996 182 C1020 182 1020 158 1040 158" stroke="#f85149" stroke-opacity="0.55" stroke-dasharray="4 4"/>
        <path d="M996 182 C1020 182 1020 206 1040 206" stroke="#3fb950" stroke-opacity="0.9"/>
      </g>
      <g font-size="13">
        <rect x="1040" y="92" width="120" height="36" rx="8" fill="#0b0f15" stroke="#f85149" stroke-opacity="0.35"/>
        <text x="1056" y="115" fill="#8b949e">primary</text>
        <text x="1134" y="115" fill="#f85149">429</text>
        <rect x="1040" y="140" width="120" height="36" rx="8" fill="#0b0f15" stroke="#f85149" stroke-opacity="0.35"/>
        <text x="1056" y="163" fill="#8b949e">backup</text>
        <text x="1126" y="163" fill="#f85149">down</text>
        <rect x="1040" y="188" width="120" height="36" rx="8" fill="#0b0f15" stroke="#3fb950" stroke-opacity="0.55"/>
        <text x="1056" y="211" fill="#c9d1d9">next</text>
        <text x="1134" y="211" fill="#3fb950">200</text>
      </g>
      <line x1="820" y1="300" x2="1160" y2="300" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="820" y="330" font-size="13" fill="#6e7681">same request, same client, same session</text>
      <text x="820" y="354" font-size="13" fill="#3fb950">served by the next model in line</text>
    </g>

    <rect x="0" y="416" width="1200" height="4" fill="#ff2056"/>
  </g>
</svg>
