name: Network access fixture
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/check-network-access.mjs"
      - "tests/redrouter/fixtures/network-listener.mjs"
      - ".github/workflows/network-access-fixture.yml"
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - uses: ./.github/actions/npm-ci-retry
      - run: node scripts/ci/check-network-access.mjs
