name: RedRouter Docker image

# Publishes ghcr.io/reddb-io/red-router built FROM THE PUBLISHED npm PACKAGE.
#
# This workflow is deliberately separate from red-publish.yml so a failure here
# can never block or fail npm publication. It never rebuilds the product from
# source: Dockerfile.npm installs @reddb-io/red-router@<version> from npm.
#
# Triggers (no push, pull_request or schedule):
# - workflow_run: after the "RedRouter" workflow completed successfully for a
#   SemVer tag push (head_branch is the tag name for tag runs).
# - workflow_dispatch: recovery with an explicit tag, e.g. when the npm job was
#   marked failed by propagation lag although the package is published, or to
#   rebuild the image after a transient registry failure.

on:
  workflow_run:
    workflows: ["RedRouter"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing SemVer tag whose published npm package becomes the image (vX.Y.Z)"
        required: true
        type: string

      preview_platforms:
        type: boolean
        description: Show selected platforms without running builds, tests or publication
        default: false
permissions:
  contents: read

concurrency:
  group: redrouter-docker-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/reddb-io/red-router

  ENABLE_LINUX_X64: ${{ vars.ENABLE_LINUX_X64 || 'true' }}
  ENABLE_LINUX_ARM64: ${{ vars.ENABLE_LINUX_ARM64 || 'true' }}
  ENABLE_WINDOWS_X64: ${{ vars.ENABLE_WINDOWS_X64 || 'true' }}
  ENABLE_WINDOWS_ARM64: ${{ vars.ENABLE_WINDOWS_ARM64 || 'false' }}
  ENABLE_MACOS_X64: ${{ vars.ENABLE_MACOS_X64 || 'false' }}
  ENABLE_MACOS_ARM64: ${{ vars.ENABLE_MACOS_ARM64 || 'false' }}
  ENABLE_LINUX_ARMV7: ${{ vars.ENABLE_LINUX_ARMV7 || 'false' }}
  ENABLE_LINUX_X86: ${{ vars.ENABLE_LINUX_X86 || 'false' }}
jobs:
  platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      linux_x64: ${{ steps.select.outputs.linux_x64 }}
      linux_arm64: ${{ steps.select.outputs.linux_arm64 }}
      windows_x64: ${{ steps.select.outputs.windows_x64 }}
      windows_arm64: ${{ steps.select.outputs.windows_arm64 }}
      macos_x64: ${{ steps.select.outputs.macos_x64 }}
      macos_arm64: ${{ steps.select.outputs.macos_arm64 }}
      linux_armv7: ${{ steps.select.outputs.linux_armv7 }}
      linux_x86: ${{ steps.select.outputs.linux_x86 }}
      any: ${{ steps.select.outputs.any }}
      docker_platforms: ${{ steps.select.outputs.docker_platforms }}
    steps:
      - id: select
        name: Filter platforms before allocating runners
        shell: python
        env:
          PLATFORM_DEFAULTS: '{"linux_x64":true,"linux_arm64":true,"windows_x64":true,"windows_arm64":false,"macos_x64":false,"macos_arm64":false,"linux_armv7":false,"linux_x86":false}'
          PLATFORM_AVAILABLE: '["linux_arm64", "linux_x64"]'
          PLATFORM_MATRICES: |
            {}
        run: |
          import json
          import os

          defaults = json.loads(os.environ["PLATFORM_DEFAULTS"])
          enabled = {}
          for key in defaults:
              name = "ENABLE_" + key.upper()
              value = os.environ[name].lower()
              if value not in ("true", "false"):
                  raise SystemExit(f"{name} must be true or false, got {value!r}")
              enabled[key] = value == "true"

          matrices = json.loads(os.environ["PLATFORM_MATRICES"])
          available = json.loads(os.environ["PLATFORM_AVAILABLE"])
          output = {key: str(value).lower() for key, value in enabled.items()}
          output["any"] = str(any(enabled[key] for key in available)).lower()
          for job, entries in matrices.items():
              selected = [entry["row"] for entry in entries if enabled[entry["flag"]]]
              output["enabled_" + job] = str(bool(selected)).lower()
              # A placeholder keeps GitHub's matrix schema valid when the job is skipped.
              output["matrix_" + job] = json.dumps({"include": selected or [entries[0]["row"]]}, separators=(",", ":"))
          docker = [target for key, target in (("linux_x64", "linux/amd64"), ("linux_arm64", "linux/arm64")) if enabled[key]]
          output["docker_platforms"] = ",".join(docker)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("### Selected platforms\n\n")
              for key in available:
                  handle.write(f"- {key}: {str(enabled[key]).lower()}\n")
  resolve:
    name: Resolve release tag
    if: >-
      ${{ !inputs.preview_platforms && ((github.repository == 'reddb-io/red-router' && (   github.event_name == 'workflow_dispatch' || (     github.event.workflow_run.conclusion == 'success' &&     github.event.workflow_run.event == 'push' &&     startsWith(github.event.workflow_run.head_branch, 'v')   ) )) && (needs.platforms.outputs.any == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Validate the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "tag must look like vX.Y.Z, got '$RELEASE_TAG'" >&2
              exit 1
            fi
            echo "'$RELEASE_TAG' is not a release tag; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "publish=true"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

    needs:
      - platforms
  image:
    name: Build and publish image
    needs:
      - resolve
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.resolve.outputs.publish == 'true') && (needs.platforms.outputs.docker_platforms != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - name: Verify tag and package version
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").name')" = '@reddb-io/red-router'
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          if [ -n "$TRIGGER_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          fi
          # Tags cut before the Dockerfile existed (a recovery dispatch for an older release) take
          # it from main. The image is built from the published npm package either way, so the
          # Dockerfile is only the recipe, never the release's source.
          if [ ! -f Dockerfile.npm ]; then
            git fetch --depth=1 https://github.com/${{ github.repository }}.git main
            git show FETCH_HEAD:Dockerfile.npm > Dockerfile.npm
          fi
          test -s Dockerfile.npm
      - name: Wait for the package on npm
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            if [ "$(npm view "@reddb-io/red-router@$VERSION" version --prefer-online --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true)" = "$VERSION" ]; then
              echo "@reddb-io/red-router@$VERSION is available on npm"
              exit 0
            fi
            echo "Waiting for npm ($attempt/150)"
            sleep 10
          done
          echo "@reddb-io/red-router@$VERSION never appeared on npm" >&2
          exit 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
        if: env.ENABLE_LINUX_ARM64 == 'true'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.resolve.outputs.version, '-') }}
      # Only the exact version tag is pushed first, so a broken image never
      # becomes :latest or :<major>.<minor>. Those move after the smoke passes.
      - name: Build and push the version tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.npm
          platforms: ${{ needs.platforms.outputs.docker_platforms }}
          push: true
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Smoke the pushed image
        run: |
          set -euo pipefail
          REF="$IMAGE@${{ steps.build.outputs.digest }}"
          platform="${{ env.ENABLE_LINUX_X64 == 'true' && 'linux/amd64' || 'linux/arm64' }}"
          docker pull --platform "$platform" "$REF"
          test "$(docker run --platform "$platform" --rm "$REF" red-router --version)" = "$VERSION"
          docker run --platform "$platform" -d --name red-router-smoke -p 127.0.0.1:25050:25050 \
            -e DISABLE_SQLITE_AUTO_BACKUP=true -e OMNIROUTE_SKIP_SYSTEM_TRUST=1 \
            "$REF"
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:25050/healthz || true)" = "200" ]; then
              echo "RedRouter answered /healthz"
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' red-router-smoke)" = "true" ] || break
            echo "Waiting for RedRouter ($attempt/60)"
            sleep 5
          done
          echo "RedRouter did not become ready" >&2
          docker logs red-router-smoke >&2 || true
          exit 1
      - name: Stop the smoke container
        if: always()
        run: docker rm -f red-router-smoke >/dev/null 2>&1 || true
      - name: Promote the floating tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "$IMAGE:$VERSION" ] && continue
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
          done <<< "$TAGS"
