name: red-publish

# Publish the release a tag names (lean mirror of the red-skills red-publish flow).
#
# Upstream of the tag is Changesets:
#   1. Land a change with `pnpm changeset` (pick patch/minor/major).
#   2. On main, run `pnpm release:version` to consume the pending changesets,
#      bump cli/package.json and update cli/CHANGELOG.md.
#   3. Commit, tag vX.Y.Z and push the tag.
#
# This workflow owns everything downstream of the tag and never touches main.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.76)"
        required: true

permissions:
  contents: read

concurrency:
  group: red-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @reddb-io/red-router
    runs-on: ubuntu-latest
    # Repository settings must protect the npm-release environment with
    # required reviewers — approval is the gate before npm publish.
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --dir cli build

      - name: Boot smoke test
        run: node cli/scripts/smoke-server.js

      - name: Publish to npm
        run: pnpm --dir cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
