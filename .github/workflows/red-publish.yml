name: RedRouter

# One product-owned pipeline:
# - every PR and main push validates RedRouter;
# - a SemVer tag runs the same validation, publishes the exact tested tarball,
#   and creates the matching GitHub Release;
# - Changesets decides the version before the tag is created.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing SemVer tag to validate/publish (optional)"
        required: false
        type: string
      artifact_run_id:
        description: "Original npm publish run ID for recovery after propagation (optional)"
        required: false
        type: string
      artifact_run_attempt:
        description: "Attempt that published the npm tarball"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: redrouter-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"
  DISABLE_SQLITE_AUTO_BACKUP: "true"
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  JWT_SECRET: redrouter-ci-only-jwt-secret-not-for-production-2026
  API_KEY_SECRET: redrouter-ci-only-api-key-secret-not-for-production-2026

jobs:
  checks:
    name: Product checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run check:node-runtime
      - run: npm run check:tracked-artifacts
      - run: npm run check:lockfile
      - run: npm run audit:deps
      - run: npm run lint
      - run: npm run typecheck:core
      - name: Check API route TypeScript diagnostics
        run: node scripts/check/check-api-typecheck.mjs
      - name: Check API typecheck gate
        run: node --import tsx/esm --test tests/unit/build/check-api-typecheck.test.ts
      - name: Check Changesets root-package versioning
        run: node scripts/release/check-changesets.mjs
      - run: npm run release:status

  test-unit:
    name: RedRouter contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run test:unit:ci
      - name: Install Linux desktop regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb dbus-x11 libayatana-appindicator3-1 python3-dbus python3-gi
      - name: Verify tray survives installation and recovers native helper failures
        run: node scripts/ci/check-linux-tray.mjs

  test-vitest:
    name: RedRouter UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run test:vitest

  build:
    name: Build and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    env:
      NODE_OPTIONS: --max-old-space-size=10240
      OMNIROUTE_USE_TURBOPACK: "0"
      OMNIROUTE_RELEASE_REF: HEAD
      REDROUTER_RELEASE_ARTIFACT_DIR: release-artifacts
      OMNIROUTE_PLAYWRIGHT_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source identity
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Validate artifact recovery input
        if: ${{ inputs.artifact_run_id != '' }}
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ inputs.artifact_run_id == '' }}
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - id: ci
        uses: ./.github/actions/npm-ci-retry
        if: ${{ inputs.artifact_run_id == '' }}
      - name: Build once
        if: ${{ inputs.artifact_run_id == '' }}
        run: npm run build:release
      - name: Pack once
        if: ${{ inputs.artifact_run_id == '' }}
        run: npm run release:pack
      - if: ${{ inputs.artifact_run_id == '' }}
        run: npm run check:pack-artifact
      - if: ${{ inputs.artifact_run_id == '' }}
        run: npm run check:pack-boot
      - name: Restore the Playwright browsers
        if: ${{ inputs.artifact_run_id == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci.outputs.lock-hash }}
      - if: ${{ inputs.artifact_run_id == '' }}
        run: node scripts/dev/run-playwright-tests.mjs install --with-deps chromium
      - if: ${{ inputs.artifact_run_id == '' }}
        run: npm run test:e2e
      - name: Upload the tested release artifact
        if: inputs.artifact_run_id == '' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redrouter-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish npm and GitHub Release
    if: github.repository == 'reddb-io/red-router' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    needs: [checks, test-unit, test-vitest, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout recovery verifier
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test "v$VERSION" = "$RELEASE_TAG"
          test "$(node -p 'require("./package.json").name')" = '@reddb-io/red-router'
          test "$(node -p 'require("./package-lock.json").packages[""].version')" = "$VERSION"
      - name: Download the tested tarball
        if: ${{ inputs.artifact_run_id == '' }}
        uses: actions/download-artifact@v7
        with:
          name: redrouter-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts
      - name: Recover the original published tarball
        if: ${{ inputs.artifact_run_id != '' }}
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
        run: |
          node .release-tools/scripts/release/recover-published.mjs
          cd release-artifacts
          sha256sum -c SHA256SUMS
      - name: Verify artifact identity and checksum
        if: ${{ inputs.artifact_run_id == '' }}
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/release/artifact.mjs verify release-artifacts
          cd release-artifacts
          sha256sum -c SHA256SUMS
      - name: Install npm with trusted publishing support
        run: npm install --prefix "$RUNNER_TEMP/redrouter-npm" --no-save npm@11.19.1
      - name: Publish the exact tarball
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(npm view "@reddb-io/red-router@$VERSION" version --prefer-online 2>/dev/null || true)" = "$VERSION" ]; then
            echo "@reddb-io/red-router@$VERSION is already published"
          else
            case "${NPM_PUBLISH_MODE:-oidc}" in
              token)
                if [ -z "${NPM_TOKEN:-}" ]; then
                  echo "NPM_PUBLISH_MODE=token but NPM_TOKEN is unavailable" >&2
                  exit 1
                fi
                npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
                ;;
              oidc)
                unset NODE_AUTH_TOKEN
                npm config delete //registry.npmjs.org/:_authToken || true
                ;;
              *)
                echo "NPM_PUBLISH_MODE must be token or oidc" >&2
                exit 1
                ;;
            esac
            node "$RUNNER_TEMP/redrouter-npm/node_modules/npm/bin/npm-cli.js" publish \
              "$GITHUB_WORKSPACE/release-artifacts/reddb-io-red-router-$VERSION.tgz" \
              --access public --provenance --ignore-scripts
          fi
      - name: Verify the public npm tarball
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED=$(node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; console.log("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(`release-artifacts/reddb-io-red-router-${process.env.VERSION}.tgz`)).digest("base64"));')
          for attempt in $(seq 1 60); do
            ACTUAL=$(npm view "@reddb-io/red-router@$VERSION" dist.integrity --prefer-online --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true)
            [ "$ACTUAL" = "$EXPECTED" ] && exit 0
            [ -z "$ACTUAL" ] || { echo "Published tarball integrity mismatch" >&2; exit 1; }
            echo "Waiting for npm processing ($attempt/60)"
            sleep 10
          done
          echo "The release is still unavailable from npm" >&2
          exit 1
      - name: Install through mise and aube
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.9.12"
          install: false
          cache: false
      - name: Smoke the published package
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MISE_NPM_PACKAGE_MANAGER: aube
          MISE_DATA_DIR: ${{ runner.temp }}/redrouter-mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/redrouter-mise-cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/redrouter-mise-config
          DATA_DIR: ${{ runner.temp }}/redrouter-consumer-data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/redrouter-consumer"
          cd "$RUNNER_TEMP/redrouter-consumer"
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("mise.toml", `[tools]\n"npm:@reddb-io/red-router" = { version = "${process.env.VERSION}", allow_low_downloads = true }\n`);'
          mise trust mise.toml
          mise install --verbose
          test "$(mise exec -- red-router --version)" = "$VERSION"
          mise exec -- red-router service --help
          mise exec -- node "$GITHUB_WORKSPACE/scripts/ci/check-published-boot.mjs"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub Release"
          else
            gh release create "$RELEASE_TAG" release-artifacts/*.tgz release-artifacts/SHA256SUMS \
              -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
