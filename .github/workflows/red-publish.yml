name: red-publish

# Publish the release a tag names (lean mirror of the red-skills red-publish flow).
#
# Upstream of the tag is Changesets:
#   1. Land a change with `pnpm changeset` (pick patch/minor/major).
#   2. On main, run `pnpm release:version` to consume the pending changesets,
#      bump cli/package.json and update cli/CHANGELOG.md.
#   3. Commit, tag vX.Y.Z and push the tag.
#
# This workflow owns everything downstream of the tag and never touches main.
#
# npm authentication: npm trusted publishing (OIDC), no stored token. The npm
# package @reddb-io/red-router must have a Trusted Publisher configured on
# npmjs.com (package Settings -> Trusted Publisher -> GitHub Actions):
#   organization/user: reddb-io
#   repository:        red-router
#   workflow filename: red-publish.yml
#   environment:       npm-release
# The repository variable NPM_PUBLISH_MODE picks the path: unset or "oidc" uses
# trusted publishing; "token" falls back to the NPM_TOKEN secret until the
# Trusted Publisher exists. npm stages token publishes and makes them public a
# few minutes later on its own, answering 422/409 "staged" meanwhile.
#
# Reruns are safe: a version npm already serves or has staged is not published
# again, and the GitHub release is created only when it does not exist yet.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.76)"
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: red-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @reddb-io/red-router
    runs-on: ubuntu-latest
    # Repository settings must protect the npm-release environment with
    # required reviewers — approval is the gate before npm publish.
    environment: npm-release
    permissions:
      # gh release create
      contents: write
      # npm trusted publishing and provenance exchange the GitHub OIDC token
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1+ (https://docs.npmjs.com/trusted-publishers);
      # Node 22 ships npm 10. Same pin as the redcode publish workflow.
      - name: Install npm with trusted publishing support
        run: |
          set -euo pipefail
          npm install -g npm@11.19.1
          npm --version | grep -Fx 11.19.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --dir cli build

      - name: Boot smoke test
        run: node cli/scripts/smoke-server.js

      - name: Remote RedRouter integration smoke
        run: node cli/scripts/smoke-remote-router.mjs

      - name: Real JEV System One smoke
        run: pnpm smoke:system-one
        env:
          SYSTEM_ONE_SMOKE_PROVIDER: ${{ vars.SYSTEM_ONE_SMOKE_PROVIDER }}
          SYSTEM_ONE_SMOKE_BASE_URL: ${{ vars.SYSTEM_ONE_SMOKE_BASE_URL }}
          SYSTEM_ONE_SMOKE_MODEL: ${{ vars.SYSTEM_ONE_SMOKE_MODEL }}
          SYSTEM_ONE_SMOKE_API_KEY: ${{ secrets.SYSTEM_ONE_SMOKE_API_KEY }}
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ vars.CLOUDFLARE_GATEWAY_ID }}
          VIVGRID_API_KEY: ${{ secrets.VIVGRID_API_KEY }}
          NANO_GPT_API_KEY: ${{ secrets.NANO_GPT_API_KEY }}

      - name: Verify tag matches package
        run: node -e "const version=require('./cli/package.json').version; if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('tag/package mismatch')"

      - name: Pack release artifact
        run: |
          mkdir -p release-artifacts
          pnpm --dir cli pack --pack-destination ../release-artifacts
          cd release-artifacts
          tar -tzf *.tgz > package-contents.txt
          if grep -E '(^|/)(\.build-home|\.red|\.9router|AppData)(/|$)|(^|/)(data\.sqlite|jwt-secret|machine-id|\.env($|\.))' package-contents.txt; then
            echo "Refusing to publish runtime data or build identity files" >&2
            exit 1
          fi
          grep -q '^package/cli.js$' package-contents.txt
          grep -q '^package/app/custom-server.js$' package-contents.txt
          rm package-contents.txt
          sha256sum *.tgz > SHA256SUMS

      # Publishes the exact tarball SHA256SUMS describes, with provenance.
      # Idempotent: a version npm already serves is skipped. npm stages a new
      # version for a few minutes before `npm view` shows it; meanwhile a retry
      # answers 409 "previously staged" and some writes answer 422. Both mean
      # npm holds the version, so the job continues to the GitHub release.
      - name: Publish to npm
        env:
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE }}
          NPM_TOKEN: ${{ vars.NPM_PUBLISH_MODE == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./cli/package.json').version")
          spec="@reddb-io/red-router@${version}"
          visible() { npm view "$spec" version >/dev/null 2>&1; }
          if visible; then echo "::notice::$spec is already on npm; skipping publish"; exit 0; fi

          case "${NPM_PUBLISH_MODE:-oidc}" in
            oidc)
              if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                echo "::error::trusted publishing needs the id-token: write permission"
                exit 1
              fi
              # npm exchanges the GitHub OIDC token itself; make sure no stale token wins.
              unset NODE_AUTH_TOKEN
              npm config delete //registry.npmjs.org/:_authToken || true
              ;;
            token)
              if [ -z "${NPM_TOKEN:-}" ]; then
                echo "::error::NPM_PUBLISH_MODE=token but the NPM_TOKEN secret is absent"
                exit 1
              fi
              echo "::warning::publishing $spec with NPM_TOKEN; configure the npm Trusted Publisher and unset NPM_PUBLISH_MODE"
              npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
              ;;
            *)
              echo "::error::NPM_PUBLISH_MODE must be unset, oidc, or token (got ${NPM_PUBLISH_MODE})"
              exit 1
              ;;
          esac

          tarballs=(release-artifacts/*.tgz)
          log="$RUNNER_TEMP/npm-publish.log"
          if npm publish "${tarballs[0]}" --access public --provenance 2>&1 | tee "$log"; then
            echo "::notice::$spec accepted by npm"
            exit 0
          fi
          if grep -qiE 'E409|previously (published|staged)|cannot publish over' "$log"; then
            echo "::notice::npm already holds $spec (published or staged); continuing"
            exit 0
          fi
          if grep -qE 'E422' "$log"; then
            for attempt in $(seq 1 20); do
              if visible; then echo "::notice::$spec became visible on npm"; exit 0; fi
              sleep 30
            done
            if grep -qi 'staged' "$log"; then
              echo "::warning::npm staged $spec and has not served it after 10 minutes; it goes public on its own"
              exit 0
            fi
          fi
          echo "::error::$spec did not publish"
          exit 1

      # Rerun-safe: an existing release (for example from a partial earlier run) is left alone.
      - name: Create GitHub release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "::notice::GitHub release $RELEASE_TAG already exists; leaving it untouched"
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --generate-notes --title "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
