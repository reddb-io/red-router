name: Rust Linux smoke artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/red-routerd
      - run: cargo build --locked --release --manifest-path rust/red-routerd/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: red-routerd-linux-x86_64
          path: rust/red-routerd/target/release/red-routerd
          if-no-files-found: error
          retention-days: 1
