name: Rust storage memory diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/red-routerd
          cache-on-failure: true
      - name: Build embedded-capable binary
        run: |
          cargo build --release --locked --manifest-path rust/red-routerd/Cargo.toml
          cp rust/red-routerd/target/release/red-routerd "$RUNNER_TEMP/red-routerd-full"
      - name: Build remote-only binary
        run: |
          cargo build --release --locked --no-default-features --manifest-path rust/red-routerd/Cargo.toml
          cp rust/red-routerd/target/release/red-routerd "$RUNNER_TEMP/red-routerd-thin"
      - name: Measure idle memory and startup
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,signal,socket,statistics,subprocess,tempfile,time,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def sample(binary,backend,run):
              with tempfile.TemporaryDirectory() as temp:
                  path=pathlib.Path(temp)
                  sock=socket.socket()
                  sock.bind(('127.0.0.1',0))
                  port=sock.getsockname()[1]
                  sock.close()
                  env=os.environ.copy()
                  env.update(RED_ROUTER_DB_BACKEND=backend,
                      RED_ROUTER_DATABASE_URL=(path/'data.rdb').as_uri() if backend=='reddb-embedded' else (path/'data.sqlite').as_uri().replace('file:','sqlite:',1)+'?mode=rwc',
                      RED_ROUTER_CLIENT_KEY='fixture-client-key-12345',RED_ROUTER_PROVIDER_KEY='fixture-provider',
                      RED_ROUTER_UPSTREAM_URL='http://127.0.0.1:19999/v1/chat/completions',
                      RED_ROUTER_LISTEN='127.0.0.1:'+str(port))
                  started=time.monotonic()
                  process=subprocess.Popen([str(binary)],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  try:
                      for _ in range(300):
                          if process.poll() is not None: raise RuntimeError('proxy exited before readiness')
                          try:
                              with urllib.request.urlopen('http://127.0.0.1:'+str(port)+'/healthz',timeout=.3) as response:
                                  if response.status==200: break
                          except Exception: time.sleep(.05)
                      else: raise RuntimeError('proxy did not become ready')
                      startup=round((time.monotonic()-started)*1000)
                      time.sleep(.5)
                      lines=pathlib.Path('/proc',str(process.pid),'status').read_text().splitlines()
                      rss=int(next(x for x in lines if x.startswith('VmRSS:')).split()[1])
                      return {'startup_ms':startup,'rss_kib':rss}
                  finally:
                      process.send_signal(signal.SIGINT)
                      try: process.wait(timeout=10)
                      except subprocess.TimeoutExpired: process.kill(); process.wait()
          for label,binary,backend in [
              ('reddb_embedded',root/'red-routerd-full','reddb-embedded'),
              ('sqlite_with_engine',root/'red-routerd-full','sqlite'),
              ('sqlite_without_engine',root/'red-routerd-thin','sqlite')]:
              samples=[sample(binary,backend,i) for i in range(3)]
              print(json.dumps({'mode':label,'binary_bytes':binary.stat().st_size,'samples':samples,'median_startup_ms':statistics.median(x['startup_ms'] for x in samples),'median_rss_kib':statistics.median(x['rss_kib'] for x in samples)}),flush=True)
          PY
