name: RedRouter live-provider diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust gateway
        run: cargo build --release --locked --manifest-path rust/red-routerd/Cargo.toml
      - name: Exercise real HTTPS provider using a deliberately invalid key
        shell: bash
        env:
          RED_ROUTER_LISTEN: 127.0.0.1:19091
          RED_ROUTER_UPSTREAM_URL: https://api.openai.com/v1/chat/completions
          RED_ROUTER_CLIENT_KEY: local-diagnostic-client-123456
          RED_ROUTER_PROVIDER_KEY: invalid-diagnostic-key
        run: |
          set -eu
          rust/red-routerd/target/release/red-routerd > "$RUNNER_TEMP/proxy.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:19091/healthz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/proxy.log"; exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          status=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' -H "Authorization: Bearer $RED_ROUTER_CLIENT_KEY" -H 'Content-Type: application/json' --data '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"test"}]}' http://127.0.0.1:19091/v1/chat/completions)
          echo "HTTP status: $status"
          test "$status" = 401
          python3 - "$RUNNER_TEMP/response.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as file:
              body = json.load(file)
          assert 'error' in body and body['error'].get('type') != 'proxy_error', 'gateway did not relay the upstream error'
          print('Provider authentication rejection reached the client through the Rust gateway')
          PY
