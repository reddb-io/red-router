name: Publish RedRouter

# RedRouter keeps its v0.x package/release channel separate from OmniRoute's
# v3.x channel. Only a tag on the protected, green main commit may publish.
on:
  push:
    tags:
      - "v0.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing RedRouter tag (v0.X.Y)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: red-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify RedRouter artifact
    if: github.repository == 'reddb-io/red-router'
    # The Next standalone build exceeds the hosted runner's memory on this tree.
    runs-on: ${{ vars.USE_VPS_RUNNER == 'true' && fromJSON('["self-hosted","omni-build"]') || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Validate tag and source
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid RedRouter tag" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag must point to a main ancestor" >&2
            exit 1
          }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful RedRouter CI for the tagged main commit
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: "reddb-io",
              repo: "red-router",
              workflow_id: "ci.yml",
              head_sha: process.env.RELEASE_SHA,
              branch: "main",
              event: "push",
              per_page: 100,
            });
            const runs = data.workflow_runs.filter(run =>
              run.head_sha === process.env.RELEASE_SHA &&
              run.head_branch === "main" && run.event === "push"
            ).sort((a, b) => b.id - a.id);
            const latest = runs[0];
            if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
              core.setFailed("The tagged commit needs a successful latest CI push run on reddb-io/red-router main. Finish CI, then rerun publication.");
            }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set RedRouter package identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set 'name=@reddb-io/red-router' "version=$VERSION" 'publishConfig.access=public'
          test "$(node -p 'require("./package.json").name')" = '@reddb-io/red-router'
          test "$(node -p 'require("./package.json").version')" = "$VERSION"

      - name: Build release artifact
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          API_KEY_SECRET: ci-release-api-key-secret-with-sufficient-length
          OMNIROUTE_USE_TURBOPACK: "0"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build:release

      - name: Validate package contents
        run: npm run check:pack-artifact

      - name: Boot packed RedRouter artifact
        run: npm run check:pack-boot

      - name: Pack and checksum
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          npm pack --ignore-scripts --pack-destination release-artifacts >/dev/null
          TARBALL="release-artifacts/reddb-io-red-router-${{ steps.version.outputs.version }}.tgz"
          test -s "$TARBALL"
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/redrouter-package-contents.txt"
          grep -Fxq 'package/bin/omniroute.mjs' "$RUNNER_TEMP/redrouter-package-contents.txt"
          grep -Fxq 'package/dist/server.js' "$RUNNER_TEMP/redrouter-package-contents.txt"
          (cd release-artifacts && sha256sum "reddb-io-red-router-${{ steps.version.outputs.version }}.tgz" > SHA256SUMS)

      - name: Upload verified artifact
        uses: actions/upload-artifact@v7
        with:
          name: redrouter-release-artifact
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @reddb-io/red-router
    if: github.repository == 'reddb-io/red-router'
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v7
        with:
          name: redrouter-release-artifact
          path: release-artifacts

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install npm with Trusted Publishing support
        run: npm install --prefix "$RUNNER_TEMP/redrouter-npm" --no-save npm@11.19.1

      - name: Verify downloaded checksum
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum -c SHA256SUMS
          test -s "reddb-io-red-router-$VERSION.tgz"

      - name: Publish exact tarball to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(npm view "@reddb-io/red-router@$VERSION" version --prefer-online 2>/dev/null || true)" = "$VERSION" ]; then
            echo "@reddb-io/red-router@$VERSION already published"
          else
            case "${NPM_PUBLISH_MODE:-oidc}" in
              token)
                if [ -z "${NPM_TOKEN:-}" ]; then
                  echo "NPM_PUBLISH_MODE=token but NPM_TOKEN is unavailable" >&2
                  exit 1
                fi
                npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
                ;;
              oidc)
                unset NODE_AUTH_TOKEN
                npm config delete //registry.npmjs.org/:_authToken || true
                ;;
              *)
                echo "NPM_PUBLISH_MODE must be token or oidc" >&2
                exit 1
                ;;
            esac
            node "$RUNNER_TEMP/redrouter-npm/node_modules/npm/bin/npm-cli.js" publish "./release-artifacts/reddb-io-red-router-$VERSION.tgz" \
              --access public --provenance --ignore-scripts
          fi

      - name: Verify registry propagation and exact tarball integrity
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED=$(node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; console.log("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(`release-artifacts/reddb-io-red-router-${process.env.VERSION}.tgz`)).digest("base64"));')
          for attempt in $(seq 1 12); do
            ACTUAL=$(npm view "@reddb-io/red-router@$VERSION" dist.integrity --prefer-online 2>/dev/null || true)
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              exit 0
            fi
            if [ -n "$ACTUAL" ]; then
              echo "Published tarball differs from the verified release artifact" >&2
              exit 1
            fi
            sleep 10
          done
          echo "The exact release is not available from npm yet" >&2
          exit 1

      - name: Setup mise for the real consumer install
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.9.12"
          install: false
          cache: false

      - name: Install published RedRouter with mise and aube trust checks
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MISE_NPM_PACKAGE_MANAGER: aube
          MISE_DATA_DIR: ${{ runner.temp }}/redrouter-mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/redrouter-mise-cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/redrouter-mise-config
          DATA_DIR: ${{ runner.temp }}/redrouter-consumer-data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/redrouter-consumer"
          cd "$RUNNER_TEMP/redrouter-consumer"
          # The root package is our own low-volume release. No transitive trust
          # exclusions, insecure TLS settings, or npm fallback are permitted.
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("mise.toml", `[tools]\n"npm:@reddb-io/red-router" = { version = "${process.env.VERSION}", allow_low_downloads = true }\n`);'
          mise trust mise.toml
          mise install --verbose
          test "$(mise exec -- red-router --version)" = "$VERSION"

      - name: Create GitHub release with checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; preserving its assets"
          else
            gh release create "$RELEASE_TAG" release-artifacts/*.tgz release-artifacts/SHA256SUMS \
              -R "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
