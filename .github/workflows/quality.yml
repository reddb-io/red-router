name: Optional quality
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: Quality suite to run
        options: [checks, unit, routing, vitest, browser, rust, all]
        default: checks
permissions:
  contents: read
concurrency:
  group: optional-quality-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"
  DISABLE_SQLITE_AUTO_BACKUP: "true"
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  JWT_SECRET: redrouter-ci-only-jwt-secret-not-for-production-2026
  API_KEY_SECRET: redrouter-ci-only-api-key-secret-not-for-production-2026


jobs:
  checks:
    if: inputs.suite == 'all' || inputs.suite == 'checks'
    name: Product checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run check:node-runtime
      - run: npm run check:tracked-artifacts
      - run: npm run check:lockfile
      - run: npm run lint
      - run: npm run typecheck:core
      - name: Check API route TypeScript diagnostics
        run: node scripts/check/check-api-typecheck.mjs
      - name: Check API typecheck gate
        run: node --import tsx/esm --test tests/unit/build/check-api-typecheck.test.ts
      - name: Check Changesets root-package versioning
        run: node scripts/release/check-changesets.mjs
      - run: npm run release:status
      - run: npm run audit:deps


  rust-data-plane:
    if: inputs.suite == 'all' || inputs.suite == 'rust'
    name: Rust data plane
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RED_ROUTER_TEST_DISPOSABLE: 1
      RED_ROUTER_TEST_POSTGRES_URL: postgresql://routing:routing-ci-only@127.0.0.1:5432/routing
      RED_ROUTER_TEST_REDDB_URL: red://127.0.0.1:15050
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: routing
          POSTGRES_PASSWORD: routing-ci-only
          POSTGRES_DB: routing
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/red-routerd
          cache-on-failure: true
      - name: Boot disposable RedDB
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o red-linux-x86_64-static https://github.com/reddb-io/reddb/releases/download/v1.28.11/red-linux-x86_64-static
          curl --fail --location --retry 3 -o SHA256SUMS https://github.com/reddb-io/reddb/releases/download/v1.28.11/SHA256SUMS
          awk '$2 == "red-linux-x86_64-static" { print; found = 1 } END { if (!found) exit 1 }' SHA256SUMS > red.sha256
          sha256sum --check red.sha256
          chmod +x red-linux-x86_64-static
          ./red-linux-x86_64-static server --path "$RUNNER_TEMP/rust-storage.rdb" --wire-bind 127.0.0.1:15050 --no-auth --no-log-file > "$RUNNER_TEMP/reddb.log" 2>&1 &
          echo "$!" > reddb.pid
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/15050) 2>/dev/null; then exit 0; fi
            kill -0 "$(cat reddb.pid)"
            sleep 1
          done
          cat reddb.log
          exit 1
      - name: Rust formatting
        run: cargo fmt --check --manifest-path rust/red-routerd/Cargo.toml
      - name: Rust storage and proxy tests
        run: cargo test --locked --manifest-path rust/red-routerd/Cargo.toml
      - name: Rust lint
        run: cargo clippy --all-targets --locked --manifest-path rust/red-routerd/Cargo.toml -- -D warnings
      - name: Remote-only build
        run: cargo check --no-default-features --locked --manifest-path rust/red-routerd/Cargo.toml
      - name: Build release binary
        run: cargo build --release --locked --manifest-path rust/red-routerd/Cargo.toml
      - name: RedDB diagnostics
        if: failure()
        run: cat "$RUNNER_TEMP/reddb.log" || true

  rust-windows-storage:
    if: inputs.suite == 'all' || inputs.suite == 'rust'
    name: Rust Windows storage
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'protoc'
          Invoke-WebRequest 'https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-win64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Join-Path $destination 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/red-routerd
          cache-on-failure: true
      - name: Test local storage and proxy restarts
        run: cargo test --locked --manifest-path rust/red-routerd/Cargo.toml --test storage --test storage_proxy


  test-unit:
    if: inputs.suite == 'all' || inputs.suite == 'unit'
    name: RedRouter contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run test:unit:ci
      - name: Install Linux desktop regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb dbus-x11 libayatana-appindicator3-1 python3-dbus python3-gi
      - name: Verify tray survives installation and recovers native helper failures
        run: node scripts/ci/check-linux-tray.mjs
      - name: Verify managed network access survives restart and binds the requested interface
        run: node scripts/ci/check-network-access.mjs


  test-routing-storage:
    if: inputs.suite == 'all' || inputs.suite == 'routing'
    name: Routing storage (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RED_ROUTER_TEST_BACKEND: ${{ matrix.backend }}
      RED_ROUTER_TEST_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgresql://routing:routing-ci-only@127.0.0.1:5432/routing' || 'postgresql://routing:routing-ci-only@127.0.0.1:55432/routing' }}
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, reddb]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: routing
          POSTGRES_PASSWORD: routing-ci-only
          POSTGRES_DB: routing
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - name: Boot pinned RedDB with checksum verification
        if: matrix.backend == 'reddb'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o red-linux-x86_64-static https://github.com/reddb-io/reddb/releases/download/v1.23.4/red-linux-x86_64-static
          curl --fail --location --retry 3 -o SHA256SUMS https://github.com/reddb-io/reddb/releases/download/v1.23.4/SHA256SUMS
          awk '$2 == "red-linux-x86_64-static" { print; found = 1 } END { if (!found) exit 1 }' SHA256SUMS > routing.sha256
          sha256sum --check routing.sha256
          chmod +x red-linux-x86_64-static
          ./red-linux-x86_64-static server --path "$RUNNER_TEMP/routing.rdb" --pg-bind 127.0.0.1:55432 --no-auth --no-log-file > "$RUNNER_TEMP/routing-reddb.log" 2>&1 &
          echo "$!" > routing-reddb.pid
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null; then exit 0; fi
            kill -0 "$(cat routing-reddb.pid)"
            sleep 1
          done
          cat routing-reddb.log
          exit 1
      - name: Verify online repository contracts
        run: node --import tsx/esm --import ./tests/_setup/isolateDataDir.ts --test --test-timeout=120000 tests/redrouter/native/online-routing.test.ts
      - name: Seed restart fixture
        run: node --import tsx/esm --import ./tests/_setup/isolateDataDir.ts scripts/ci/check-routing-storage-restart.ts seed
      - name: Restart PostgreSQL
        if: matrix.backend == 'postgres'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U routing; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Crash and restart RedDB
        if: matrix.backend == 'reddb'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          kill -KILL "$(cat routing-reddb.pid)"
          for attempt in $(seq 1 30); do
            if ! (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null; then break; fi
            sleep 1
          done
          ./red-linux-x86_64-static server --path "$RUNNER_TEMP/routing.rdb" --pg-bind 127.0.0.1:55432 --no-auth --no-log-file >> "$RUNNER_TEMP/routing-reddb.log" 2>&1 &
          echo "$!" > routing-reddb.pid
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify routing data survived database restart
        run: node --import tsx/esm --import ./tests/_setup/isolateDataDir.ts scripts/ci/check-routing-storage-restart.ts verify
      - name: RedDB diagnostics
        if: failure() && matrix.backend == 'reddb'
        run: cat "$RUNNER_TEMP/routing-reddb.log"


  test-vitest:
    if: inputs.suite == 'all' || inputs.suite == 'vitest'
    name: RedRouter UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run test:vitest


  browser:
    if: inputs.suite == 'all' || inputs.suite == 'browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=10240
      OMNIROUTE_USE_TURBOPACK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run build:release
      - run: node scripts/dev/run-playwright-tests.mjs install --with-deps chromium
      - run: npm run test:e2e
