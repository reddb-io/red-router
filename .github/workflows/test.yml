name: RedRouter gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: red-router-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile
      - name: Install test dependencies
        run: pnpm --dir tests install --ignore-workspace --lockfile=false
      - name: Lint changed subsystems
        run: |
          # EndpointPageClient has five pre-existing React compiler lint errors;
          # the production build below still validates its changed markup.
          mapfile -t lint_files < <(git diff --diff-filter=ACMR --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- '*.js' '*.mjs' ':(exclude)src/app/(dashboard)/dashboard/endpoint/EndpointPageClient.js')
          if (( ${#lint_files[@]} > 0 )); then
            pnpm exec eslint "${lint_files[@]}"
          fi
      - name: Verify diagnostic logging contract
        working-directory: tests
        run: npx vitest run unit/cli-diagnostics.test.js unit/cli-tray-log.test.js --reporter=verbose
      # The suite is deterministic (tests/setup/deterministic.js: no network, sandboxed
      # HOME/DATA_DIR, UTC) and fully green, so any failure fails the gate — no retries.
      - name: Run test suite
        working-directory: tests
        run: npx vitest run
      - name: Build application
        run: pnpm run build
      - name: Install GitBook dependencies
        run: npm install --prefix gitbook --no-audit --no-fund
      - name: Build GitBook
        run: npm run build --prefix gitbook
