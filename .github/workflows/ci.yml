name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"
  DISABLE_SQLITE_AUTO_BACKUP: "true"
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  JWT_SECRET: redrouter-ci-only-jwt-secret-not-for-production-2026
  API_KEY_SECRET: redrouter-ci-only-api-key-secret-not-for-production-2026

jobs:
  lint:
    name: Product checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run check:node-runtime
      - run: npm run check:tracked-artifacts
      - run: npm run check:lockfile
      - run: npm run audit:deps
      - run: npm run lint
      - run: npm run typecheck:core
      - name: Check Changesets root-package versioning
        run: node scripts/release/check-changesets.mjs
      - run: npm run release:status
      - name: Show the exact RedRouter test selection
        run: |
          node scripts/test/run-redrouter.mjs native --list
          node scripts/test/run-redrouter.mjs ui --list
          node scripts/test/run-redrouter.mjs e2e --list

  test-unit:
    name: RedRouter contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run test:unit:ci

  test-vitest:
    name: RedRouter UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - run: npm run test:vitest

  build:
    name: Build, browser and installed-package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      OMNIROUTE_USE_TURBOPACK: "0"
      # PRs validate their actual merge checkout; publication separately requires main ancestry.
      OMNIROUTE_RELEASE_REF: HEAD
      REDROUTER_RELEASE_ARTIFACT_DIR: release-artifacts
      OMNIROUTE_PLAYWRIGHT_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - name: Build once for all product smoke checks
        run: npm run build:release
      - name: Pack the final version once
        run: npm run release:pack
      - run: npm run check:pack-artifact
      - run: npm run check:pack-boot
      - run: node scripts/dev/run-playwright-tests.mjs install --with-deps chromium
      - run: npm run test:e2e
      - name: Retain the tested main artifact for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redrouter-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redrouter-browser-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
