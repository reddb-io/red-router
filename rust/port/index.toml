notes = "The cache is the in-memory credential_health::State owned by the control plane. A result keeps its timestamp, and the 5-minute TTL is applied on read (healthy, the view's fresh flag, the summary's stale count) instead of deleting expired rows; the admin view lists expired rows too, marked not fresh. removeCredentialHealth is retain over the live accounts at each sweep. isCredentialStale only feeds a log line of the legacy credentialGate (an untested account is still allowed), and the daemon has no log, so it has no counterpart; the summary computes staleness itself. The test helpers and initCredentialCache (a flag the Rust state does not need) have no counterpart either. The summary is served on GET /api/monitoring/health to an administrator."

