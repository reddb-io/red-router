[package]
name = "red-routerd"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
reddb-embedded = ["reddb-io-client/embedded", "dep:fs2"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
futures-util = "0.3"
fs2 = { version = "0.4", optional = true }
getrandom = "=0.3.4"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
percent-encoding = "2"
reddb-io-client = { version = "=1.28.19", default-features = false, features = ["redwire-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "any"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
time = { version = "0.3.55", features = ["formatting"] }
url = "2"
aes-gcm = "0.10"
base64 = "0.22"
scrypt = "0.11"
hex = "0.4"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
zeroize = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
