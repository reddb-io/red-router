[package]
name = "red-routerd"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["reddb-embedded"]
reddb-embedded = ["reddb-io-client/embedded"]

[dependencies]
axum = "0.8"
futures-util = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
percent-encoding = "2"
reddb-io-client = { version = "=1.28.18", default-features = false, features = ["redwire-tls"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "any"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
