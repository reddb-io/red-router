services:
  redrouter-prod:
    container_name: redrouter-prod
    build:
      context: .
      dockerfile: Dockerfile.rust
    image: redrouter:rust
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - path: .env
        required: false
    environment:
      - RED_ROUTER_LISTEN=0.0.0.0:${DASHBOARD_PORT:-25050}
      - RED_ROUTER_ALLOW_REMOTE_LISTEN=1
      - RED_ROUTER_DB_BACKEND=sqlite
      - RED_ROUTER_DATABASE_URL=sqlite:///app/data/red-router.sqlite
      - RED_ROUTER_SPA_DIR=/app/dashboard
      - RED_ROUTER_ADMIN_KEY=${RED_ROUTER_ADMIN_KEY:-}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:-}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-true}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${PROD_DASHBOARD_PORT:-20130}:${DASHBOARD_PORT:-25050}"
    volumes:
      - redrouter-prod-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${DASHBOARD_PORT:-25050}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redrouter-prod-data:
    name: redrouter-prod-data
